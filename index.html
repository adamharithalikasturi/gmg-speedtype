<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMG Fastest Fingers</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0c1f5a;--ink:#14213d;--bg:#f4f6fb;--card:#fff;--line:#dfe4f0;--gold:#e0a526;--ok:#1a8f5c;--bad:#d23b3b;--mute:#6b7693}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 28px}
    header img{height:40px}
    header h1{font:800 22px Fraunces,serif;margin:0;color:var(--navy)}
    header button{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--mute);cursor:pointer;font:inherit}
    main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1fr);gap:24px;max-width:1150px;margin:24px auto;padding:0 20px}
    @media(max-width:860px){main{grid-template-columns:1fr}}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
    h2{font:800 20px Fraunces,serif;margin:0 0 14px;color:var(--navy)}
    label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
    input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
    input:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
    .photo{display:flex;align-items:center;gap:12px;margin-top:14px}
    .av{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;background-size:cover;background-position:center}
    .btn{margin-top:20px;width:100%;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:14px;font:600 16px Inter;cursor:pointer}
    .btn:hover{background:#15307f}
    small{font-size:13px;color:var(--mute)}
    .target{font:600 28px/1.3 "SF Mono",Consolas,monospace;letter-spacing:1px;background:var(--bg);border-radius:10px;padding:18px;margin:10px 0;text-align:center;word-break:break-word}
    .target span.ok{color:var(--ok)}.target span.bad{color:#fff;background:var(--bad);border-radius:3px}.target span.cur{box-shadow:inset 0 -3px var(--navy)}
    .hide{display:none!important}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px 8px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
    th{color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase}
    .num{text-align:right}
    .pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;text-align:center}
    .pod .card{background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
    .pod .card .av{width:40px;height:40px;font-size:14px}
    .pod .p1{order:2;background:#fff8e6;border:1px solid #f2e3b6}
    .pod .p2{order:1}
    .pod .p3{order:3}
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo">
    <h1>Fastest Fingers</h1>
    <button id="adminbtn">Reset</button>
  </header>
  <main>
    <section class="panel">
      <div id="v-form">
        <h2>Rider Details</h2>
        <label>Full Name</label>
        <input type="text" id="name" placeholder="e.g. Alex Tan">
        <label>Department / Team</label>
        <input type="text" id="dept" placeholder="e.g. Logistics">
        <label>Avatar Photo (optional)</label>
        <div class="photo">
          <div id="avf" class="av">?</div>
          <button type="button" id="picbtn" style="background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer">Upload photo</button>
          <input type="file" id="pic" accept="image/*" class="hide">
        </div>
        <button id="startbtn" class="btn">Start Challenge</button>
      </div>

      <div id="v-play" class="hide">
        <h2>Type Fast!</h2>
        <small>Copy the text below as fast as you can. Timer starts on first keypress.</small>
        <div id="target" class="target"></div>
        <input type="text" id="inp" placeholder="Start typing here..." autocomplete="off" spellcheck="false">
      </div>

      <div id="v-res" class="hide">
        <h2>Results</h2>
        <p id="res-msg"></p>
        <button id="retrybtn" class="btn">Try Again</button>
      </div>
    </section>

    <section class="panel">
      <h2>Leaderboard</h2>
      <div id="podium" class="pod"></div>
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Dept</th><th class="num">WPM</th><th class="num">Acc</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="small hide" id="empty">No scores yet. Be the first.</p>
    </section>
  </main>

  <script>
    const PW = 'Welcome2GMG@2026';
    const $ = id => document.getElementById(id);
    let me = JSON.parse(localStorage.getItem('gmgProfile') || '{}'), photo = me.photo || '', rows = [], t0 = 0, keys = 0, errs = 0, sample = '';
    const ini = n => n.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '?';
    const avHTML = (r, cls = '') => r.photo ? `<div class="av ${cls}" style="background-image:url(${r.photo})"></div>` : `<div class="av ${cls}">${ini(r.name)}</div>`;
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    
    $('name').value = me.name \vert{}\vert{} '';$('dept').value = me.dept || '';
    
    function setAv() { const a = $('avf'); a.textContent = photo ? '' : ini($('name').value); a.style.backgroundImage = photo ? `url(${photo})` : 'none'; }
    setAv();
    $('name').oninput = setAv;
    $('picbtn').onclick = () => $('pic').click();$('pic').onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const c = document.createElement('canvas'), ctx = c.getContext('2d'), img = new Image();
      img.onload = () => {
        c.width = 120; c.height = 120;
        ctx.drawImage(img, 0, 0, 120, 120);
        photo = c.toDataURL('image/jpeg', 0.6);
        setAv();
      };
      img.src = URL.createObjectURL(f);
    };

    function show(v) { ['v-form', 'v-play', 'v-res'].forEach(x => $(x).classList.toggle('hide', x !== v)); }

    async function load() { try { rows = await (await fetch('/api/scores')).json(); draw(); } catch {} }
    function draw() {
      const top = [...rows].sort((a, b) => b.net - a.net), mk = (r, i) => `<div class="card p${i + 1}">${avHTML(r)}<strong>${esc(r.name)}</strong><small>${r.net} WPM</small></div>`;
      const order = [1, 0, 2].filter(i => top[i]);
      $('podium').innerHTML = order.map(i => mk(top[i], i)).join('');
      $('empty').classList.toggle('hide', top.length > 0);$('rows').innerHTML = top.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.dept || '-')}</td><td class="num"><strong>${r.net}</strong></td><td class="num">${r.acc}%</td></tr>`).join('');
    }

    const SAMPLES = [
      "Fastest fingers in the warehouse win the trophy.",
      "Accuracy matters just as much as speed under pressure.",
      "E-commerce excellence demands quick action and precise execution."
    ];

    $('startbtn').onclick = () => {
      const name = $('name').value.trim(), dept =$('dept').value.trim();
      if (!name) return alert('Please enter your name.');
      me = { name, dept, photo };
      localStorage.setItem('gmgProfile', JSON.stringify(me));
      sample = SAMPLES[Math.floor(Math.random() * SAMPLES.length)];
      $('target').innerHTML = sample.split('').map((c, i) => `<span class="${i === 0 ? 'cur' : ''}">${esc(c)}</span>`).join('');
      $('inp').value = '';
      show('v-play');
      $('inp').focus();
      t0 = 0; keys = 0; errs = 0;
    };

    $('inp').oninput = e => {
      if (!t0) t0 = Date.now();
      keys++;
      const val = $('inp').value, spans =$('target').children;
      let localErrs = 0;
      for (let i = 0; i < sample.length; i++) {
        const c = val[i];
        if (c == null) {
          spans[i].className = i === val.length ? 'cur' : '';
        } else if (c === sample[i]) {
          spans[i].className = 'ok';
        } else {
          spans[i].className = 'bad';
          localErrs++;
        }
      }
      errs = localErrs;
      if (val === sample) finish();
    };

    async function finish() {
      const elapsedMin = (Date.now() - t0) / 60000;
      const gross = Math.round((sample.length / 5) / elapsedMin);
      const acc = Math.max(0, Math.round(((sample.length - errs) / sample.length) * 100));
      const net = Math.max(0, Math.round(gross * (acc / 100)));
      $('res-msg').innerHTML = `You typed at <strong>${net} WPM</strong> with <strong>${acc}%</strong> accuracy!`;
      show('v-res');
      try {
        await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...me, gross, acc, net })
        });
        load();
      } catch {}
    }

    $('retrybtn').onclick = () => show('v-form');

    $('adminbtn').onclick = async () => {
      const p = prompt('Enter admin password to reset leaderboard:');
      if (p === PW) {
        await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: p }) });
        load();
      } else if (p) {
        alert('Wrong password.');
      }
    };

    load();
  </script>
</body>
</html>
