<script>
const PW = 'Welcome2GMG@2026';
const $ = id => document.getElementById(id);

let me = {};
try {
  me = JSON.parse(localStorage.getItem('gmgProfile') || '{}');
} catch (e) { me = {}; }

let photo = me.photo || '';
let rows = [];
let t0 = 0, keys = 0, errors = 0, prev = '';

const ini = n => (n || '').trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '?';

function setAv() {
  const a = $('avf');
  if (!a) return;
  if (photo) {
    a.textContent = '';
    a.style.backgroundImage = `url(${photo})`;
  } else {
    a.textContent = ini($('name').value);
    a.style.backgroundImage = 'none';
  }
}

// Prefill form
if ($('name'))$('name').value = me.name || '';
if ($('dept'))$('dept').value = me.dept || '';
setAv();

if ($('name'))$('name').oninput = setAv;

// PHOTO UPLOAD HANDLER
const picInput = $('pic');
const picBtn = $('picbtn');

if (picBtn && picInput) {
  picBtn.addEventListener('click', () => {
    picInput.click();
  });

  picInput.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      alert('Please select an image file (PNG or JPEG).');
      return;
    }

    const reader = new FileReader();
    reader.onerror = () => alert('Failed to read image file.');
    reader.onload = event => {
      const img = new Image();
      img.onerror = () => alert('Invalid image file format.');
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 96;
          canvas.height = 96;
          const ctx = canvas.getContext('2d');
          
          const minDim = Math.min(img.width, img.height);
          const sx = (img.width - minDim) / 2;
          const sy = (img.height - minDim) / 2;
          
          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, 96, 96);
          
          photo = canvas.toDataURL('image/jpeg', 0.80);
          setAv();
        } catch (err) {
          console.error('Canvas error:', err);
          alert('Could not process image.');
        }
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function show(v) {
  ['v-form', 'v-play', 'v-res'].forEach(x => {
    const el = $(x);
    if (el) el.classList.toggle('hide', x !== v);
  });
}

const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const avHTML = (r, cls = '') => r.photo ? `<div class="av ${cls}" style="background-image:url(${r.photo})"></div>` : `<div class="av ${cls}">${ini(r.name)}</div>`;

async function load() {
  try {
    const res = await fetch('/api/scores');
    if (res.ok) {
      rows = await res.json();
      draw();
    }
  } catch (err) {
    console.error('Failed to load leaderboard:', err);
  }
}

function draw() {
  const top = [...rows].sort((a, b) => b.net - a.net);
  const mk = (r, i) => `<div class="pod p${i + 1}">${avHTML(r)}<div class="nm">${esc(r.name)}</div><div class="sc">${r.net} pts</div><div class="blk">${i + 1}</div></div>`;
  const order = [1, 0, 2].filter(i => top[i]);
  
  if ($('podium'))$('podium').innerHTML = order.map(i => mk(top[i], i)).join('');
  if ($('empty'))$('empty').classList.toggle('hide', top.length > 0);
  if ($('rows')) {$('rows').innerHTML = top.map((r, i) => `
      <tr class="${r.name === me.name && r.dept === me.dept ? 'me' : ''}">
        <td>${i + 1}</td>
        <td class="n">${avHTML(r)}${esc(r.name)}</td>
        <td>${esc(r.dept)}</td>
        <td class="num">${r.wpm}</td>
        <td class="num">${r.acc}%</td>
        <td class="num">${(r.timeMs / 1000).toFixed(2)}s</td>
        <td class="num"><b>${r.net}</b></td>
      </tr>
    `).join('');
  }
}

load();
setInterval(load, 4000);

if ($('go')) {$('go').onclick = () => {
    const name = $('name').value.trim();
    const dept = $('dept').value.trim();
    
    if (!name || !dept) {
      if ($('err'))$('err').textContent = 'Enter your name and department to start.';
      return;
    }
    
    if ($('err'))$('err').textContent = '';
    me = { name, dept, photo };
    
    try {
      localStorage.setItem('gmgProfile', JSON.stringify(me));
    } catch (e) {
      console.warn('LocalStorage save failed:', e);
    }
    
    draw();
    show('v-play');
    if ($('typing'))$('typing').classList.add('hide');
    if ($('count'))$('count').classList.remove('hide');
    
    let n = 3;
    if ($('count'))$('count').textContent = n;
    const iv = setInterval(() => {
      n--;
      if (n > 0) {
        if ($('count'))$('count').textContent = n;
        return;
      }
      clearInterval(iv);
      begin();
    }, 900);
  };
}

function renderTarget(v) {
  if (!$('target')) return;
  $('target').innerHTML = [...PW].map((c, i) => {
    let k = '';
    if (i < v.length) k = v[i] === c ? 'ok' : 'bad';
    else if (i === v.length) k = 'cur';
    return `<span class="${k}">${esc(c)}</span>`;
  }).join('');
}

function begin() {
  if ($('count'))$('count').classList.add('hide');
  if ($('typing'))$('typing').classList.remove('hide');
  const t = $('typed');
  if (!t) return;
  t.value = '';
  prev = '';
  keys = errors = 0;
  t0 = 0;
  renderTarget('');
  t.focus();
}

if ($('typed')) {
  $('typed').addEventListener('paste', e => e.preventDefault());$('typed').addEventListener('input', e => {
    const t = e.target;
    const v = t.value;
    if (!t0) t0 = performance.now();
    if (v.length > prev.length) {
      for (let i = prev.length; i < v.length; i++) {
        keys++;
        if (v[i] !== PW[i]) errors++;
      }
    }
    prev = v;
    renderTarget(v);
    if (v === PW) {
      t.blur();
      finish();
    }
  });
}

async function finish() {
  const timeMs = performance.now() - t0;
  try {
    const res = await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...me, timeMs, keys, errors })
    });
    const r = await res.json();
    if (r.error) {
      alert(r.error);
      show('v-form');
      return;
    }
    const a = r.attempt;
    const b = r.bestRow || a;
    if ($('cw'))$('cw').textContent = a.wpm;
    if ($('ca'))$('ca').textContent = a.acc + '%';
    if ($('cn'))$('cn').textContent = a.net;
    if ($('rw'))$('rw').textContent = b.wpm;
    if ($('ra'))$('ra').textContent = b.acc + '%';
    if ($('rn'))$('rn').textContent = b.net;
    if ($('rtitle'))$('rtitle').textContent = r.best ? 'New Personal Best!' : 'Attempt Complete';
    if ($('rrank'))$('rrank').textContent = `You are ranked #${r.rank} of ${r.total}.`;
    
    show('v-res');
    await load();
  } catch (err) {
    alert('Could not reach the server. Check your connection and try again.');
    show('v-form');
  }
}

if ($('again'))$('again').onclick = () => show('v-form');

if ($('admin')) {$('admin').onclick = async () => {
    const pin = prompt('Admin PIN');
    if (!pin) return;
    if (!confirm('This deletes every score. Continue?')) return;
    const r = await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    if (r.ok) {
      await load();
    } else {
      alert('Wrong PIN.');
    }
  };
}
</script>
